<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Xỉu Pro - Soi Cầu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 15px;
            color: white;
        }

        .game-container {
            max-width: 420px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            color: #f1c40f;
            font-size: 24px;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }

        /* INFO BAR */
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.08);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .balance-box span:first-child { color: #aaa; font-size: 13px; }
        .balance-box .money { color: #2ecc71; font-weight: bold; font-size: 18px; margin-left: 5px; }
        .bet-input input {
            width: 90px;
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            text-align: right;
            font-size: 15px;
            background: #fff;
        }

        /* DICE AREA */
        .dice-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }

        .dice { font-size: 50px; transition: transform 0.1s; }
        
        .dice.shake {
            animation: shake 0.6s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-20deg) scale(1.1); }
            50% { transform: rotate(20deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.05); }
        }

        /* RESULT */
        .result-display {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.08);
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-display.tai { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .result-display.xiu { background: linear-gradient(90deg, #3498db, #2980b9); }
        .result-display.triple { background: linear-gradient(90deg, #9b59b6, #8e44ad); }
        .result-display.wait { background: rgba(255,255,255,0.08); color: #aaa; }

        /* CONTROLS */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .controls button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .controls button:active { transform: scale(0.95); }
        .btn-tai { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .btn-xiu { background: linear-gradient(135deg, #3498db, #2980b9); color: white; }

        /* NEW ROUND BUTTON */
        .new-round-btn {
            display: none;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            animation: pulse 1s infinite;
        }

        .new-round-btn.show { display: block; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(241, 196, 15, 0); }
        }

        /* HISTORY */
        .section-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .section-box h3 {
            font-size: 14px;
            color: #f1c40f;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .history-item {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .history-item.tai { background: #e74c3c; }
        .history-item.xiu { background: #3498db; }
        .history-item.triple { background: #9b59b6; }

        /* CẦU ANALYSIS */
        .cau-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .cau-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(255,255,255,0.08);
            transition: all 0.3s;
        }

        .cau-item.hot { 
            background: rgba(241, 196, 15, 0.3); 
            border: 1px solid #f1c40f;
        }

        .cau-item .name { color: #aaa; }
        .cau-item .count { font-weight: bold; color: #fff; }

        /* STATS */
        .stats-row {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
        }

        .stats-row span b { color: #fff; }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>🎲 TÀI XỈU PRO</h1>
    </header>

    <div class="info-bar">
        <div class="balance-box">
            <span>Số dư:</span>
            <span class="money" id="balance">1,000,000</span>
        </div>
        <div class="bet-input">
            <span>Cược:</span>
            <input type="number" id="betAmount" value="10000">
        </div>
    </div>

    <div class="dice-area">
        <div class="dice" id="dice1">🎲</div>
        <div class="dice" id="dice2">🎲</div>
        <div class="dice" id="dice3">🎲</div>
    </div>

    <div class="result-display wait" id="resultDisplay">
        ➡️ Chọn Tài hoặc Xỉu để bắt đầu!
    </div>

    <div class="controls" id="controls">
        <button class="btn-tai" onclick="play('tai')">⬆️ TÀI</button>
        <button class="btn-xiu" onclick="play('xiu')">⬇️ XỈU</button>
    </div>

    <button class="new-round-btn" id="newRoundBtn" onclick="newRound()">
        🎮 VÁN MỚI - TIẾP TỤC CHƠI!
    </button>

    <div class="section-box">
        <h3>📊 Lịch sử (15 ván gần nhất)</h3>
        <div class="history-list" id="historyList">
            <span style="color: #666; font-size: 12px;">Chưa có ván nào</span>
        </div>
        <div class="stats-row">
            <span>Tổng: <b id="totalGames">0</b></span>
            <span>Tài: <b id="taiCount">0</b></span>
            <span>Xỉu: <b id="xiuCount">0</b></span>
            <span>TH: <b id="tripleCount">0</b></span>
        </div>
    </div>

    <div class="section-box">
        <h3>🔍 Soi Cầu - Dự đoán</h3>
        <div class="cau-grid" id="cauGrid">
            <div class="cau-item" data-cau="cau-tai">
                <span class="name">Cầu Tài</span>
                <span class="count" id="cau-tai">0</span>
            </div>
            <div class="cau-item" data-cau="cau-xiu">
                <span class="name">Cầu Xỉu</span>
                <span class="count" id="cau-xiu">0</span>
            </div>
            <div class="cau-item" data-cau="cau-dao">
                <span class="name">Cầu Đảo</span>
                <span class="count" id="cau-dao">0</span>
            </div>
            <div class="cau-item" data-cau="cau-chan">
                <span class="name">Cầu Chẵn</span>
                <span class="count" id="cau-chan">0</span>
            </div>
            <div class="cau-item" data-cau="cau-le">
                <span class="name">Cầu Lẻ</span>
                <span class="count" id="cau-le">0</span>
            </div>
            <div class="cau-item" data-cau="cau-tron">
                <span class="name">Cầu Tròn</span>
                <span class="count" id="cau-tron">0</span>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
